<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 四张特性卡片,统一深色 + 渐变描边 -->
  <g>
    <!-- Skills -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="305" height="300" rx="16" fill="#161b26" stroke="#30363d"/>
      <rect x="0" y="0" width="305" height="300" rx="16" fill="none" stroke="url(#edge)" stroke-opacity="0.35"/>
      <circle cx="56" cy="64" r="30" fill="#7c3aed" fill-opacity="0.16"/>
      <text x="56" y="76" text-anchor="middle" font-size="34">🧠</text>
      <text x="32" y="146" font-size="24" font-weight="700" fill="#f0f6fc">Skills</text>
      <text x="32" y="176" font-size="15" fill="#8b949e">Best practices your agent</text>
      <text x="32" y="196" font-size="15" fill="#8b949e">auto-loads — no prompting</text>
      <text x="32" y="216" font-size="15" fill="#8b949e">required.</text>
      <text x="32" y="252" font-size="14" fill="#58a6ff">auto-loaded rules</text>
    </g>

    <!-- Reviewers -->
    <g transform="translate(325,0)">
      <rect x="0" y="0" width="305" height="300" rx="16" fill="#161b26" stroke="#30363d"/>
      <rect x="0" y="0" width="305" height="300" rx="16" fill="none" stroke="url(#edge)" stroke-opacity="0.35"/>
      <circle cx="56" cy="64" r="30" fill="#58a6ff" fill-opacity="0.16"/>
      <text x="56" y="76" text-anchor="middle" font-size="34">🔍</text>
      <text x="32" y="146" font-size="24" font-weight="700" fill="#f0f6fc">Reviewers</text>
      <text x="32" y="176" font-size="15" fill="#8b949e">A read-only subagent your</text>
      <text x="32" y="196" font-size="15" fill="#8b949e">agent delegates to before</text>
      <text x="32" y="216" font-size="15" fill="#8b949e">committing.</text>
      <text x="32" y="252" font-size="14" fill="#58a6ff">review before commit</text>
    </g>

    <!-- Guards -->
    <g transform="translate(650,0)">
      <rect x="0" y="0" width="305" height="300" rx="16" fill="#161b26" stroke="#30363d"/>
      <rect x="0" y="0" width="305" height="300" rx="16" fill="none" stroke="url(#edge)" stroke-opacity="0.35"/>
      <circle cx="56" cy="64" r="30" fill="#3fb950" fill-opacity="0.16"/>
      <text x="56" y="76" text-anchor="middle" font-size="34">🛡️</text>
      <text x="32" y="146" font-size="24" font-weight="700" fill="#f0f6fc">Guards</text>
      <text x="32" y="176" font-size="15" fill="#8b949e">Hooks that block dangerous</text>
      <text x="32" y="196" font-size="15" fill="#8b949e">commands, secrets and trunk</text>
      <text x="32" y="216" font-size="15" fill="#8b949e">pushes — before they land.</text>
      <text x="32" y="252" font-size="14" fill="#3fb950">fail-open by design</text>
    </g>

    <!-- Updates -->
    <g transform="translate(975,0)">
      <rect x="0" y="0" width="305" height="300" rx="16" fill="#161b26" stroke="#30363d"/>
      <rect x="0" y="0" width="305" height="300" rx="16" fill="none" stroke="url(#edge)" stroke-opacity="0.35"/>
      <circle cx="56" cy="64" r="30" fill="#d29922" fill-opacity="0.16"/>
      <text x="56" y="76" text-anchor="middle" font-size="34">🔄</text>
      <text x="32" y="146" font-size="24" font-weight="700" fill="#f0f6fc">Updates</text>
      <text x="32" y="176" font-size="15" fill="#8b949e">One command keeps every</text>
      <text x="32" y="196" font-size="15" fill="#8b949e">preset current — with a</text>
      <text x="32" y="216" font-size="15" fill="#8b949e">file-level diff preview.</text>
      <text x="32" y="252" font-size="14" fill="#d29922">update · dry-run · watch</text>
    </g>
  </g>
</svg>
